services:
  worklogs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zen-worklogs-app
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/healthz || wget -q -O - http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
